<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Vibrant Cities</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(rgba(10,10,30,0.7), rgba(10,10,30,0.7)),
        url("https://pub-8aee4a5c22f846f0b2663e654f389536.r2.dev/2025/09/Hong-Kong-China-%E2%80%93-Harbor-Lights-and-Bustling-StreetsManson-YimUnsplash--1200x694.jpg");
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      color: #E6E6FA;
    }

    header {
      text-align: center;
      padding: 60px 20px;
      animation: fadeDown 1.2s ease;
    }

    header h1 {
      font-size: 3rem;
      letter-spacing: 2px;
      color: #7DF9FF;
    }

    header p {
      margin-top: 10px;
      font-size: 1.2rem;
      opacity: 0.9;
      color: #CDB4DB;
    }

    .card-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 30px;
      padding: 50px;
      animation: fadeUp 1.5s ease;
    }

    .card {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
      transition: all 0.4s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-15px) scale(1.03);
      box-shadow: 0 30px 60px rgba(125, 249, 255, 0.5);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .card:hover img {
      transform: scale(1.15);
    }

    .card-content {
      padding: 20px;
    }

    .card-content a {
      display: inline-block;
      font-size: 1.5rem;
      font-weight: bold;
      color: #7DF9FF;
      text-decoration: none;
      letter-spacing: 1px;
      position: relative;
      transition: all 0.3s ease;
    }

    .card-content a::after {
      content: '';
      position: absolute;
      width: 0%;
      height: 3px;
      left: 0;
      bottom: -6px;
      background: #FF5DA2;
      transition: width 0.3s ease;
    }

    .card-content a:hover {
      color: #FF5DA2;
      text-shadow: 0 0 15px rgba(255, 93, 162, 0.8);
    }

    .card-content a:hover::after {
      width: 100%;
    }

    .card-content p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 8px;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 0.9rem;
      opacity: 0.7;
      color: #BDE0FE;
    }
  </style>
</head>

<body>

  <header>
    <h1>Vibrant Cities</h1>
    <p>Energy • Culture • Nightlife</p>
  </header>

  <section class="card-container">

    <div class="card">
      <img src="https://media.architecturaldigest.com/photos/5da74823d599ec0008227ea8/16:9/w_2560%2Cc_limit/GettyImages-946087016.jpg" alt="New York">
      <div class="card-content">
        <a href="NewYork.html" target="_blank">New York</a>
        <p>The city that never sleeps, filled with lights and ambition.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://images.contentstack.io/v3/assets/blt06f605a34f1194ff/bltc1564bc44f66a900/675e1262cbd7d6bc5f15c6b0/japan-725347-Header_Mobile.jpg?fit=crop&disable=upscale&auto=webp&quality=60&crop=smart" alt="Tokyo">
      <div class="card-content">
        <a href="Tokyo.html" target="_blank">Tokyo</a>
        <p>Neon streets, cutting-edge tech, and timeless traditions.</p>
      </div>
    </div>

    <div class="card">
      <img src="https://i.pinimg.com/736x/21/a1/1c/21a11c9910514f11824d7977846a5894.jpg" alt="Paris">
      <div class="card-content">
        <a href="Paris.html" target="_blank">Paris</a>
        <p>Art, fashion, romance, and iconic cityscapes.</p>
      </div>
    </div>

  </section>

  <footer>
    © 2026 Vibrant Cities Explorers 🌆
  </footer>

</body>
</html>
